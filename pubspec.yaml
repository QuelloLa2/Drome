name: drome
description: "Music App"
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.13.7
  flutter: ^3.47.9

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  crypto: ^3.0.8
  cached_network_image: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Quantico
      fonts:
        - asset: fonts/Quantico-Regular.ttf
        - asset: fonts/Quantico-Bold.ttf
          weight: 700
    - family: Dots
      fonts:
        - asset: fonts/dots-font.otf

  assets:
    - assets/icon.png
